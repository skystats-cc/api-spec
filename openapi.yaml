      summary: Your alert webhooks (Max)
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [platform]
      operationId: createWebhook
      summary: Add an https webhook for your alerts (Max, up to 3). The signing secret is returned once.
      description: |
        Each delivery is a JSON POST with a `skystats-signature` header of the form `t=<unix>,v1=<hex>`,
        where v1 is HMAC-SHA256 of `<t>.<body>` with your secret. Reject old timestamps to stop replays.
        URLs must be https on a public host. A webhook switches off after 20 failed deliveries in a row.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Webhook' }
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/me/webhooks/{id}:
    delete:
      tags: [platform]
      operationId: deleteWebhook
      summary: Remove a webhook
      security: [{ webSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/me/webhooks/{id}/test:
    post:
      tags: [platform]
      operationId: testWebhook
      summary: Send a test event to a webhook
      security: [{ webSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/sessions/rotate:
    post:
      tags: [me]
      operationId: rotateSession
      summary: Swap the web session cookie for a fresh one (the site does this daily)
      security: [{ webSession: [] }]
      responses:
        '200':
          description: New cookie set
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt]
                properties:
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/flags:
    get:
      tags: [platform]
      operationId: getFlags
      summary: Which feature flags are on for you (signed out works too)
      security: [{}, { webSession: [] }, { apiKey: [] }]
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: object
                    additionalProperties: { type: boolean }
  /v1/billing/gift:
    post:
      tags: [billing]
      operationId: giftCheckout
      summary: Buy one month of Pro or Max as a gift. The code arrives in your SkyStats inbox.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [pro, max] }
      responses:
        '200':
          description: Stripe Checkout URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/billing/redeem:
    post:
      tags: [billing]
      operationId: redeemGift
      summary: Redeem a gift code
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, examples: [ABCD-EFGH-JKLM-NPQR] }
      responses:
        '200':
          description: Your plan now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/bazaar/stream:
    get:
      tags: [bazaar]
      operationId: streamBazaar
      summary: Live bazaar prices (Server-Sent Events, free)
      description: Sends a `prices` event with the products whose buy or sell price changed since the last tick.
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/batch:
    post:
      tags: [platform]
      operationId: batch
      summary: Up to 20 read-only GETs in one request (bazaar, items, players, status, election, your own data)
      security: [{}, { webSession: [] }, { apiKey: [] }, { botKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [path]
                    properties:
                      path: { type: string, maxLength: 200, examples: [/v1/bazaar/ENCHANTED_DIAMOND] }
      responses:
        '200':
          description: One result per request, in order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [path, status, body]
                      properties:
                        path: { type: string }
                        status: { type: integer }
                        body: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
