components:
  securitySchemes:
    modToken:
      type: http
      scheme: bearer
      description: Token from /v1/auth/mod/verify (prefix ssm_)
    webSession:
      type: apiKey
      in: cookie
      name: ss_session
      description: HttpOnly cookie set by /v1/pairing/{pairingId}/poll, Discord sign-in or account switching
    botKey:
      type: apiKey
      in: header
      name: x-bot-key
      description: Internal only. Sent with x-discord-user-id; the request acts as that Discord user's linked account.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Public API key (Max, prefix ssk_). Read-only GETs on your own data and public data, plus /v1/batch. Has its own rate limit.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: Bazaar product id, e.g. ENCHANTED_DIAMOND (case-insensitive)
      schema: { type: string, pattern: '^[A-Za-z0-9_:\-]{1,64}$' }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: Expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not possible in the current state (see `error`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Your plan doesn't include this (`upgrade_required`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: A dependency (billing, Hypixel) is unavailable; try again later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Machine-readable code }
        message: { type: string }

    BazaarProduct:
      type: object
      required: [id, name, buyPrice, sellPrice, margin, buyVolume, sellVolume,
                 buyMovingWeek, sellMovingWeek, buyOrders, sellOrders, updatedAt]
      properties:
        id: { type: string, examples: [ENCHANTED_DIAMOND] }
        name: { type: string, examples: [Enchanted Diamond] }
        buyPrice: { type: number, description: Price to instabuy }
        sellPrice: { type: number, description: Price received when instaselling }
        margin: { type: number, description: buyPrice - sellPrice }
        buyVolume: { type: integer }
        sellVolume: { type: integer }
        buyMovingWeek: { type: integer, description: Items instabought over the last 7 days }
        sellMovingWeek: { type: integer, description: Items instasold over the last 7 days }
        buyOrders: { type: integer }
        sellOrders: { type: integer }
        updatedAt: { type: string, format: date-time }

    BazaarSnapshot:
      type: object
      required: [takenAt, buyPrice, sellPrice, buyVolume, sellVolume, buyMovingWeek, sellMovingWeek]
      properties:
        takenAt: { type: string, format: date-time }
        buyPrice: { type: number }
        sellPrice: { type: number }
        buyVolume: { type: integer }
        sellVolume: { type: integer }
        buyMovingWeek: { type: integer }
        sellMovingWeek: { type: integer }

    HypixelStatus:
      type: object
      required: [indicator, description, components, incidents, checkedAt]
      properties:
        indicator:
          type: string
          enum: [none, minor, major, critical, unknown]
        description: { type: string }
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, examples: [operational, degraded_performance, major_outage] }
        incidents:
          type: array
          items:
            type: object
            required: [name, status, impact, url]
            properties:
              name: { type: string }
              status: { type: string }
              impact: { type: [string, 'null'] }
              url: { type: [string, 'null'] }
        checkedAt: { type: [string, 'null'], format: date-time }

    Account:
      type: object
      required: [uuid, username, trackingEnabled, modLastSeenAt, modVersion, createdAt]
      properties:
        uuid: { type: string, description: Minecraft UUID without dashes, examples: [069a79f444e94726a5befca90e38aaf5] }
        username: { type: string, examples: [Notch] }
        trackingEnabled: { type: boolean }
        modLastSeenAt: { type: [string, 'null'], format: date-time }
        modVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    ModChallenge:
      type: object
      required: [serverId, expiresAt]
      properties:
        serverId: { type: string, description: Pass to Mojang joinServer }
        expiresAt: { type: string, format: date-time }

    ModSession:
      type: object
      required: [token, expiresAt, account]
      properties:
        token: { type: string, description: 'Bearer token, prefix ssm_' }
        expiresAt: { type: string, format: date-time }
        account: { $ref: '#/components/schemas/Account' }

    Pairing:
      type: object
      required: [id, code, command, secret, expiresAt, pollIntervalSeconds]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [ABCD-EFGH] }
        command: { type: string, examples: ['/skystats link ABCD-EFGH'] }
        secret: { type: string, description: Keep in the browser; needed to poll }
        expiresAt: { type: string, format: date-time }
        pollIntervalSeconds: { type: integer }

    StaffAny:
      type: object
      description: Staff-panel payload (shape documented in the server; internal)
      additionalProperties: true

    Announcement:
      type: object
      required: [id, message, level, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        level: { type: string, enum: [info, warning, critical] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }

    PendingSignup:
      type: object
      required: [discordId, discordUsername, createdAt, expiresAt]
      properties:
        discordId: { type: string }
        discordUsername: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Deleted if Minecraft isn't paired by then (30 days) }

    PairingStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, linked, expired]
        account: { $ref: '#/components/schemas/Account' }
        discordLinked:
          type: [boolean, 'null']
          description: Only when the code was made during a Discord sign-up (or from the bot). false means Discord couldn't be linked (a second account on a free plan).

    ProfileMember:
      type: object
      required: [uuid, username, isYou, onSkyStats, usesMod, trackingEnabled, firstJoin, purse, personalBank, skyblockLevel]
      properties:
        uuid: { type: string }
        username: { type: [string, 'null'], description: null until the name lookup finishes }
        isYou: { type: boolean }
        onSkyStats: { type: boolean, description: Has a SkyStats account }
        usesMod: { type: boolean, description: SkyStats mod seen in the last 30 days }
        trackingEnabled:
          type: [boolean, 'null']
          description: null when the member isn't on SkyStats
        firstJoin: { type: [string, 'null'], format: date-time }
        purse: { type: [number, 'null'] }
        personalBank: { type: [number, 'null'] }
        skyblockLevel: { type: [integer, 'null'] }

    Profile:
      type: object
      required: [id, name, gameMode, selected, coop, bank, members, updatedAt]
      properties:
        id: { type: string }
        name: { type: [string, 'null'], examples: [Strawberry] }
        gameMode:
          type: string
          description: normal, ironman, island (stranded), bingo, ...
        selected: { type: boolean, description: Your currently selected profile }
        coop: { type: boolean, description: More than one active member }
        bank: { type: [number, 'null'], description: Shared bank balance (null if the API setting is off) }
        members:
          type: array
          items: { $ref: '#/components/schemas/ProfileMember' }
        updatedAt: { type: string, format: date-time }

    MyProfiles:
      type: object
      required: [profiles, lastFetchedAt]
      properties:
        lastFetchedAt: { type: [string, 'null'], format: date-time, description: null if never fetched yet }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/Profile' }

    ModSnapshot:
      type: object
      required: [profileId, purse]
      additionalProperties: false
      properties:
        profileId: { type: string, description: Hypixel profile id (dashes optional) }
        purse: { type: number, minimum: 0 }
        personalBank: { type: [number, 'null'], minimum: 0 }
        profileBank: { type: [number, 'null'], minimum: 0, description: Shared co-op bank }
        skyblockXp: { type: [number, 'null'], minimum: 0 }
        inventory:
          type: array
          maxItems: 300
          description: Item ids and counts from your own inventory. Only the total value is stored.
          items:
            type: object
            required: [id, count]
            properties:
              id: { type: string }
              count: { type: integer, minimum: 1 }

    SnapshotResult:
      type: object
      required: [stored]
      properties:
        stored: { type: boolean }
        reason: { type: string, enum: [too_soon, unknown_profile] }

    MoneyPoint:
      type: object
      required: [t, total]
      properties:
        t: { type: string, description: ISO time (raw) or YYYY-MM-DD (daily) }
        total: { type: [number, 'null'], description: Purse + personal bank + shared bank (daily = closing value) }
        purse: { type: [number, 'null'] }
        personalBank: { type: [number, 'null'] }
        profileBank: { type: [number, 'null'] }
        open: { type: [number, 'null'] }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }

    MoneyHistory:
      type: object
      required: [tier, range, from, retentionDays, clippedByTier, resolution, points]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        range: { type: string }
        from: { type: [string, 'null'], format: date-time }
        retentionDays: { type: [integer, 'null'], description: null = unlimited }
        clippedByTier: { type: boolean, description: The range asked for goes further back than your plan keeps }
        resolution: { type: string, enum: [raw, daily] }
        points:
          type: array
          items: { $ref: '#/components/schemas/MoneyPoint' }

    PrivacySettings:
      type: object
      required: [trackingEnabled, profilePublic, showOnLeaderboards, allowActivityPings, hideBank, discordPublic, showTierRole, activityInsights]
      properties:
        trackingEnabled: { type: boolean, description: Record money history from the mod }
        profilePublic: { type: boolean, default: false, description: Anyone can see your summary at /p/<name> and via the bot }
        showOnLeaderboards: { type: boolean, default: false }
        allowActivityPings: { type: boolean, default: false, description: Co-op members may get alerts when you start playing }
        hideBank: { type: boolean, default: true, description: Hide your purse and bank from co-op members on SkyStats }
        discordPublic: { type: boolean, default: false, description: 'Others can see your Minecraft name via /whois and you get the linked role' }
        showTierRole: { type: boolean, default: false, description: Show a Pro or Max role in the SkyStats Discord server }
        activityInsights: { type: boolean, default: false, description: 'Label your sessions by activity (farming, mining) from what the mod sees' }

    PrivacySettingsPatch:
      type: object
      additionalProperties: false
      properties:
        trackingEnabled: { type: boolean }
        profilePublic: { type: boolean }
        showOnLeaderboards: { type: boolean }
        allowActivityPings: { type: boolean }
        hideBank: { type: boolean }
        discordPublic: { type: boolean }
        showTierRole: { type: boolean }
        activityInsights: { type: boolean }

    Tier:
      type: string
      enum: [free, pro, max]

    Entitlement:
      type: object
      required: [tier, status, currentPeriodEnd, cancelAtPeriodEnd, graceUntil, retentionDays, features]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        status: { type: string, description: 'none, trialing, active, past_due, canceled' }
        currentPeriodEnd: { type: [string, 'null'], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        graceUntil: { type: [string, 'null'], format: date-time, description: Paid features stay on until here after a failed payment }
        retentionDays: { type: [integer, 'null'] }
        features:
          type: array
          items: { type: string, examples: [alerts.price] }

    RedirectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

    PublicPlayer:
      type: object
      required: [uuid, username, usesMod, theme, vanity, badges, profiles]
      properties:
        uuid: { type: string }
        username: { type: string }
        usesMod: { type: boolean }
        theme: { type: [string, 'null'] }
        vanity: { type: [string, 'null'] }
        badges:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key: { type: string }
              name: { type: string }
        profiles:
          type: array
          items:
            type: object
            required: [id, name, gameMode, selected, skyblockLevel, total, week]
            properties:
              id: { type: string }
              name: { type: [string, 'null'] }
              gameMode: { type: string }
              selected: { type: boolean }
              skyblockLevel: { type: [integer, 'null'] }
              total: { type: [number, 'null'], description: Latest mod-reported coins; null when the player hides their bank }
              week:
                type: array
                description: Daily closing totals for the last 7 days (empty when hidden)
                items:
                  type: object
                  required: [day, total]
                  properties:
                    day: { type: string }
                    total: { type: [number, 'null'] }

    DiscordLink:
      type: object
      required: [enabled, linked, discordUsername, linkedAt]
      properties:
        enabled: { type: boolean, description: Discord login is set up on this server }
        linked: { type: boolean }
        discordUsername: { type: [string, 'null'] }
        linkedAt: { type: [string, 'null'], format: date-time }

    LinkedAccount:
      type: object
      required: [uuid, username, current]
      properties:
        uuid: { type: string }
        username: { type: [string, 'null'] }
        current: { type: boolean }

    SessionInfo:
      type: object
      required: [id, kind, userAgent, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [web, mod] }
        userAgent: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }

    BotPairing:
      type: object
      required: [id, code, command, expiresAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        command: { type: string }
        expiresAt: { type: string, format: date-time }

    BotPairingStatus:
      type: object
      required: [status, username, discordLinked]
      properties:
        status: { type: string, enum: [pending, linked, expired] }
        username: { type: [string, 'null'] }
        discordLinked: { type: boolean, description: false when this would be a second account on a free plan }

    NotificationPrefs:
      type: object
      required: [discordDm, quietStartMin, quietEndMin, timeZone, dailyDigest, weeklyRecap, coopActivity, mayorReminder, patchNotes, outages]
      properties:
        discordDm: { type: boolean, description: Send notifications as Discord DMs (needs Discord linked) }
        quietStartMin: { type: [integer, 'null'], description: Minutes after local midnight; Pro and above }
        quietEndMin: { type: [integer, 'null'] }
        timeZone: { type: string, examples: [Europe/London] }
        dailyDigest: { type: boolean, description: Pro and above }
        weeklyRecap: { type: boolean, description: Pro and above }
        coopActivity: { type: boolean, description: Pro and above; only for members who allow it }
        mayorReminder: { type: boolean, description: Pro and above }
        patchNotes: { type: boolean, description: Free }
        outages: { type: boolean, description: Free }

    NotificationPrefsPatch:
      type: object
      additionalProperties: false
      properties:
        discordDm: { type: boolean }
        quietStartMin: { type: [integer, 'null'], minimum: 0, maximum: 1439 }
        quietEndMin: { type: [integer, 'null'], minimum: 0, maximum: 1439 }
        timeZone: { type: string }
        dailyDigest: { type: boolean }
        weeklyRecap: { type: boolean }
        coopActivity: { type: boolean }
        mayorReminder: { type: boolean }
        patchNotes: { type: boolean }
        outages: { type: boolean }

    NewAlertRule:
      type: object
      required: [kind, productId]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [price, anomaly, manipulation] }
        productId: { type: string, examples: [ENCHANTED_DIAMOND] }
        side: { type: string, enum: [buy, sell], default: buy }
        op: { type: string, enum: [above, below], description: Price alerts only }
        threshold: { type: number, description: 'Coins for price alerts; z-score for unusual moves (default 4)' }
        cooldownMinutes: { type: integer, minimum: 5, maximum: 10080, default: 60 }

    AlertRule:
      type: object
      required: [id, kind, productId, side, op, threshold, cooldownMinutes, active, lastFiredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [price, anomaly, manipulation] }
        productId: { type: string }
        side: { type: string, enum: [buy, sell] }
        op: { type: [string, 'null'] }
        threshold: { type: [number, 'null'] }
        cooldownMinutes: { type: integer }
        active: { type: boolean }
        lastFiredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Goal:
      type: object
      required: [id, profileId, target, createdAt, reachedAt]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string }
        target: { type: number }
        createdAt: { type: string, format: date-time }
        reachedAt: { type: [string, 'null'], format: date-time }
        perDay: { type: [number, 'null'], description: 'Average change per day over the last 14 days' }
        eta: { type: [string, 'null'], format: date-time, description: 'Estimate at the recent pace; null when not growing' }

    GuildSettings:
      type: object
      required: [guildId, statusChannelId, newsChannelId, boardChannelId, bazaarChannelId, verifiedRoleId]
      properties:
        guildId: { type: string }
        statusChannelId: { type: [string, 'null'] }
        newsChannelId: { type: [string, 'null'] }
        boardChannelId: { type: [string, 'null'] }
        bazaarChannelId: { type: [string, 'null'] }
        verifiedRoleId: { type: [string, 'null'] }

    ApiKey:
      type: object
      required: [id, name, prefix, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }

    Webhook:
      type: object
      required: [id, url, active, failures, lastStatus, lastDeliveryAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        active: { type: boolean }
        failures: { type: integer }
        lastStatus: { type: [integer, 'null'] }
        lastDeliveryAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, kind, title, body, url, createdAt, readAt]
      properties:
        id: { type: integer }
        kind: { type: string, examples: [price, anomaly, manipulation, goal, coop, digest, recap, mayor, patch, outage] }
        title: { type: string }
        body: { type: string }
        url: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }

    NewsItem:
      type: object
      required: [id, title, publishedAt]
      properties:
        id: { type: string, description: Link to the post }
        title: { type: string }
        publishedAt: { type: [string, 'null'], format: date-time }

    Election:
      type: object
      required: [mayor, perks, candidates, open, year, checkedAt]
      properties:
        mayor: { type: [string, 'null'] }
        perks:
          type: array
          items: { type: object, additionalProperties: true }
        candidates:
          type: array
          items: { type: object, additionalProperties: true }
        open: { type: boolean }
        year: { type: [integer, 'null'] }
        checkedAt: { type: [string, 'null'], format: date-time }

    Item:
      type: object
      required: [id, name, category, tier, npcSellPrice]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: [string, 'null'] }
        tier: { type: [string, 'null'] }
        npcSellPrice: { type: [number, 'null'] }

    Mover:
      type: object
      required: [productId, now, then, change]
      properties:
        productId: { type: string }
        now: { type: number }
        then: { type: number }
        change: { type: number, description: '0.1 means +10%' }

    Movers:
      type: object
      required: [window, gainers, losers]
      properties:
        window: { type: string }
        gainers: { type: array, items: { $ref: '#/components/schemas/Mover' } }
        losers: { type: array, items: { $ref: '#/components/schemas/Mover' } }

    OrderLevel:
      type: object
      required: [amount, pricePerUnit, orders]
      properties:
        amount: { type: number }
        pricePerUnit: { type: number }
        orders: { type: number }

    Flip:
      type: object
      required: [productId, name, buyAt, sellAt, margin, marginPct, hourlyVolume, potentialPerHour]
      properties:
        productId: { type: string }
        name: { type: string }
        buyAt: { type: number, description: Buy order price }
        sellAt: { type: number, description: Sell offer price }
        margin: { type: number, description: Per item after tax }
        marginPct: { type: number }
        hourlyVolume: { type: number }
        potentialPerHour: { type: number, description: 'If you filled 1% of hourly volume. An illustration, not a promise.' }

    CraftPlan:
      type: object
      required: [productId, name, sellPrice, cost, craft, profit]
      properties:
        productId: { type: string }
        name: { type: string }
        sellPrice: { type: [number, 'null'] }
        cost: { type: [number, 'null'] }
        craft: { type: boolean, description: Crafting is cheaper than buying }
        profit: { type: [number, 'null'] }
        parts:
          type: array
          items: { type: object, additionalProperties: true }

    AuctionPrices:
      type: object
      required: [itemId, lowestBin, listings, updatedAt, history]
      properties:
        itemId: { type: string }
        lowestBin: { type: [number, 'null'] }
        listings: { type: integer }
        updatedAt: { type: [string, 'null'], format: date-time }
        history:
          type: array
          items:
            type: object
            required: [hour, median, min, sales]
            properties:
              hour: { type: string, format: date-time }
              median: { type: number }
              min: { type: number }
              sales: { type: integer }

    MethodSummary:
      type: object
      required: [id, name, family, category, tier, beta, unit, locked, value, requirements, rating]
      properties:
        id: { type: string, examples: ['flip:ENCHANTED_COAL', 'craft:ENCHANTED_COAL_BLOCK'] }
        name: { type: string }
        family: { type: string, enum: [curated, flip, npc, craft, custom] }
        category: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        beta: { type: boolean }
        unit: { type: string, enum: [hour, action] }
        locked: { type: boolean, description: Your plan doesn't include it; value is null }
        value: { type: [number, 'null'], description: Coins per unit; null when locked or a price is missing }
        requirements: { type: array, items: { type: string } }
        rating:
          type: [object, 'null']
          required: [score, votes, difficulty, worksYes, worksNo]
          properties:
            score: { type: integer }
            votes: { type: integer }
            difficulty: { type: [number, 'null'] }
            worksYes: { type: integer }
            worksNo: { type: integer }

    MethodDetail:
      type: object
      required: [id, name, tier, beta, unit, source, requirements, value, lines]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        beta: { type: boolean }
        unit: { type: string, enum: [hour, action] }
        source: { type: string, description: Where the numbers come from }
        requirements: { type: array, items: { type: string } }
        value: { type: [number, 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [item, name, qty, side, source, unitPrice, total]
            properties:
              item: { type: string }
              name: { type: string }
              qty: { type: number }
              side: { type: string, enum: [in, out] }
              source: { type: string, enum: [instasell, instabuy, npc, bin] }
              unitPrice: { type: [number, 'null'] }
              total: { type: [number, 'null'] }

    CustomMethodInput:
      type: object
      required: [name, spec]
      properties:
        name: { type: string, maxLength: 60 }
        spec:
          type: object
          required: [unit, outputs, inputs]
          properties:
            unit: { type: string, enum: [hour, action] }
            outputs: { type: array, items: { $ref: '#/components/schemas/PriceRef' } }
            inputs: { type: array, items: { $ref: '#/components/schemas/PriceRef' } }
            coins: { type: number }
            requirements: { type: array, items: { type: string } }

    PriceRef:
      type: object
      required: [item, qty]
      properties:
        item: { type: string }
        qty: { type: number }
        source: { type: string, enum: [instasell, instabuy, npc, bin] }

    PlaySession:
      type: object
      required: [id, profileId, startedAt, endedAt, minutes, coins, coinsPerHour, activity, methodId]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        minutes: { type: integer }
        coins: { type: [number, 'null'] }
        coinsPerHour: { type: [number, 'null'] }
        activity: { type: [string, 'null'], description: Only with activity insights on }
        methodId: { type: [string, 'null'] }

    MoneyDay:
      type: object
      required: [day, open, close, change]
      properties:
        day: { type: string }
        open: { type: [number, 'null'] }
        close: { type: [number, 'null'] }
        change: { type: [number, 'null'] }

    MoneyDays:
      type: object
      required: [days, best, worst, milestones]
      properties:
        days: { type: array, items: { $ref: '#/components/schemas/MoneyDay' } }
        best: { type: array, items: { $ref: '#/components/schemas/MoneyDay' } }
        worst: { type: array, items: { $ref: '#/components/schemas/MoneyDay' } }
        milestones:
          type: array
          items:
            type: object
            required: [amount, day]
            properties:
              amount: { type: number }
              day: { type: string }

    PeriodPoint:
      type: object
      required: [offsetHours, change]
      properties:
        offsetHours: { type: number }
        change: { type: number }

    Annotation:
      type: object
      required: [id, profileId, at, text]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string }
        at: { type: string, format: date-time }
        text: { type: string }

    CoopView:
      type: object
      required: [profileId, days, members, ledger, feed, inviteUrl]
      properties:
        profileId: { type: string }
        days: { type: integer }
        inviteUrl: { type: string }
        members:
          type: array
          items:
            type: object
            required: [uuid, username, active, isYou, onSkyStats, sharing, online, gain, share, leftAt]
            properties:
              uuid: { type: string }
              username: { type: [string, 'null'] }
              active: { type: boolean }
              isYou: { type: boolean }
              onSkyStats: { type: boolean }
              sharing: { type: boolean, description: Shares coins with the co-op }
              online: { type: boolean }
              gain: { type: [number, 'null'] }
              share: { type: [number, 'null'], description: Share of the co-op's positive gains }
              leftAt: { type: [string, 'null'], format: date-time }
        ledger:
          type: array
          items:
            type: object
            required: [uuid, at, amount]
            properties:
              uuid: { type: string }
              at: { type: string, format: date-time }
              amount: { type: number, description: Positive = deposit into the co-op bank }
        feed:
          type: array
          items:
            type: object
            required: [uuid, startedAt, minutes, coins]
            properties:
              uuid: { type: string }
              startedAt: { type: string, format: date-time }
              minutes: { type: integer }
              coins: { type: [number, 'null'] }

    Leaderboard:
      type: object
      required: [board, period, scope, entries, you]
      properties:
        board: { type: string }
        period: { type: string }
        scope: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [rank, label, value, isYou]
            properties:
              rank: { type: integer }
              label: { type: string }
              value: { type: number }
              isYou: { type: boolean }
        you:
          type: [object, 'null']
          required: [rank, value]
          properties:
            rank: { type: integer }
            value: { type: number }

    Achievement:
      type: object
      required: [key, name, description, earnedAt]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        earnedAt: { type: [string, 'null'], format: date-time }

    Wrapped:
      type: object
      required: [period, from, to, clippedByPlan, coinsGained, bestDay, daysPlayed, consistency, longestStreak, sessions, hoursPlayed, topActivity, topDrops, achievements]
      properties:
        period: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        clippedByPlan: { type: boolean }
        coinsGained: { type: number }
        bestDay:
          type: [object, 'null']
          required: [day, change]
          properties:
            day: { type: string }
            change: { type: number }
        daysPlayed: { type: integer }
        consistency: { type: number }
        longestStreak: { type: integer }
        sessions: { type: integer }
        hoursPlayed: { type: integer }
        topActivity: { type: [string, 'null'] }
        topDrops:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: [string, 'null'] }
              count: { type: integer }
        achievements: { type: array, items: { type: string } }

    ProfileLook:
      type: object
      required: [profileTheme, vanity, themes]
      properties:
        profileTheme: { type: [string, 'null'] }
        vanity: { type: [string, 'null'] }
        themes: { type: array, items: { type: string } }

    Competition:
      type: object
      required: [id, guildId, name, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
