openapi: 3.1.0
info:
  title: SkyStats API
  version: 0.11.0
  description: |
    Public API for skystats.cc. Hypixel SkyBlock bazaar and status data.

    Rate limited per client IP. Responses include `x-ratelimit-*` headers.

    ## Authentication
    - **Mod token** (`Authorization: Bearer ssm_...`): the mod proves the player's identity through
      Mojang's session server (`/v1/auth/mod/challenge` → Mojang `joinServer` → `/v1/auth/mod/verify`).
      The player's Minecraft access token is only ever sent to Mojang.
    - **Web session** (`ss_session` cookie, HttpOnly): created by pairing. The website shows a code,
      the player runs `/skystats link <code>` in game, and the website's poll receives the cookie.
servers:
  - url: https://api.skystats.cc
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: health
    description: Liveness and readiness checks (not rate limited)
  - name: bazaar
    description: Live and historical bazaar prices for every product
  - name: status
    description: Hypixel network status, cached from status.hypixel.net
  - name: auth
    description: Mod authentication via Mojang session server, and logout
  - name: pairing
    description: Link a browser to a Minecraft account with a short code
  - name: me
    description: The signed-in player's account, settings, profiles and co-ops
  - name: mod
    description: Endpoints used by the SkyStats mod
  - name: players
    description: Public player summaries (opt-in only)
  - name: billing
    description: Plans, Stripe Checkout and the customer portal
  - name: discord
    description: Sign in with Discord, linking, and switching between your Minecraft accounts
  - name: alerts
    description: Alerts, goals, notification preferences and the inbox (Pro and above, except outage and patch notices)
  - name: market
    description: Bazaar insight, auctions and items. Raw prices are free; computed insight is Pro or Max
  - name: methods
    description: Money-making methods valued from live prices
  - name: insight
    description: Sessions, daily summaries, co-op view and notes built from what the mod reports
  - name: social
    description: Leaderboards, follows, achievements, Wrapped and public profile looks (all opt-in)
  - name: platform
    description: Public API keys, webhooks, feature flags, live data, batch requests and gifts
  - name: staff
    description: Staff panel (players with the SkyStats staff role in Discord). Every call is audit-logged.
  - name: bot
    description: Used by the SkyStats Discord bot on the internal network only (never through Cloudflare)

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Process is up
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /readyz:
    get:
      tags: [health]
      operationId: getReady
      summary: Process can reach its database
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: false }
                  db: { type: string }

  /v1/bazaar:
    get:
      tags: [bazaar]
      operationId: listBazaarProducts
      summary: Latest prices for every bazaar product
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive search on product id or name
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/BazaarProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/bazaar/{productId}:
    get:
      tags: [bazaar]
      operationId: getBazaarProduct
      summary: Latest prices for one product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BazaarProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/bazaar/{productId}/history:
    get:
      tags: [bazaar]
      operationId: getBazaarHistory
      summary: Price snapshots for one product, oldest first
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 3650, default: 7 }
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [productId, days, snapshots]
                properties:
                  productId: { type: string }
                  days: { type: integer }
                  snapshots:
                    type: array
                    items: { $ref: '#/components/schemas/BazaarSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/status:
    get:
      tags: [status]
      operationId: getHypixelStatus
      summary: Cached status.hypixel.net summary
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HypixelStatus' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/mod/challenge:
    post:
      tags: [auth]
      operationId: createModChallenge
      summary: Start mod authentication
      description: |
        Returns a one-time `serverId`. The mod calls Mojang's `joinServer` with it, then `/v1/auth/mod/verify`.
        Valid for 2 minutes.
      responses:
        '200':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModChallenge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/mod/verify:
    post:
      tags: [auth]
      operationId: verifyModChallenge
      summary: Finish mod authentication (checked with Mojang hasJoined)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, serverId]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9_]{1,16}$' }
                serverId: { type: string, pattern: '^[a-f0-9]{40}$' }
      responses:
        '200':
          description: Mod session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session (clears the web cookie)
      security: [{ webSession: [] }, { modToken: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/pairing:
    post:
      tags: [pairing]
      operationId: createPairing
      summary: Create a pairing code to show on the website
      description: |
        Keep `secret` in the browser; it's needed to poll. The player runs `command` in game.
        Codes expire after 10 minutes.
      responses:
        '201':
          description: Pairing created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pairing' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/pairing/{pairingId}/poll:
    post:
      tags: [pairing]
      operationId: pollPairing
      summary: Check whether the code has been claimed in game
      description: When the status becomes `linked`, the response sets the `ss_session` cookie (once).
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, minLength: 20, maxLength: 128 }
      responses:
        '200':
          description: Pairing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/pairing/claim:
    post:
      tags: [pairing]
      operationId: claimPairing
      summary: Claim a pairing code from the mod
      security: [{ modToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'e.g. ABCD-EFGH (case and dash insensitive)', maxLength: 16 }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema:
                type: object
                required: [linked, account]
                properties:
                  linked: { type: boolean, const: true }
                  account: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/mod/heartbeat:
    post:
      tags: [mod]
      operationId: modHeartbeat
      summary: Tell SkyStats the mod is running (every ~5 minutes while on Hypixel)
      security: [{ modToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modVersion, minecraftVersion]
              properties:
                modVersion: { type: string, maxLength: 32 }
                minecraftVersion: { type: string, maxLength: 32 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, trackingEnabled, nextHeartbeatSeconds]
                properties:
                  ok: { type: boolean }
                  trackingEnabled: { type: boolean }
                  nextHeartbeatSeconds: { type: integer }
                  snapshotEverySeconds: { type: integer, description: How often the mod should send /v1/mod/snapshot }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in account
      security: [{ webSession: [] }, { modToken: [] }]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/settings:
    patch:
      tags: [me]
      operationId: updateMySettings
      summary: Update account settings
      security: [{ webSession: [] }, { modToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trackingEnabled:
                  type: boolean
                  description: When false, SkyStats stops recording your money history and shows "tracking disabled" to your co-op.
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/profiles:
    get:
      tags: [me]
      operationId: getMyProfiles
      summary: Your SkyBlock profiles and co-op members
      security: [{ webSession: [] }, { modToken: [] }]
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfiles' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/profiles/refresh:
    post:
      tags: [me]
      operationId: refreshMyProfiles
      summary: Queue a refresh from the Hypixel API
      security: [{ webSession: [] }, { modToken: [] }]
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/mod/snapshot:
    post:
      tags: [mod]
      operationId: modSnapshot
      summary: Report the player's own coins (the only source of money history)
      description: |
        Hypixel's API policy forbids building stat histories by polling the Public API, so the mod
        reports the player's own purse (scoreboard) and banks (bank menu). Ignored while tracking is off.
      security: [{ modToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModSnapshot' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResult' }
        '202':
          description: Not stored (too soon, or the profile is being looked up)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/players/{name}:
    get:
      tags: [players]
      operationId: getPublicPlayer
      summary: A player's public SkyStats summary
      description: Only for players who turned on a public profile. Built from SkyStats data only; it never triggers a Hypixel lookup.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_]{1,16}$' }
      responses:
        '200':
          description: Public summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPlayer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/money:
    get:
      tags: [me]
      operationId: getMyMoney
      summary: Your money history for one profile, clipped to your tier's retention
      security: [{ webSession: [] }, { modToken: [] }]
      parameters:
        - { name: profileId, in: query, required: true, schema: { type: string } }
        - name: range
          in: query
          schema: { type: string, enum: ['1d', '7d', '30d', '90d', '1y', all], default: '7d' }
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoneyHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/privacy:
    get:
      tags: [me]
      operationId: getMyPrivacy
      summary: Your privacy settings (everything social is off by default)
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMyPrivacy
      summary: Change privacy settings
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacySettingsPatch' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Download everything SkyStats holds about you (UK GDPR access and portability)
      security: [{ webSession: [] }]
      responses:
        '200':
          description: JSON export (sent as an attachment)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/me/delete:
    post:
      tags: [me]
      operationId: deleteMyAccount
      summary: Permanently delete your account and history (UK GDPR erasure)
      description: Cancels any paid subscription first. Cannot be undone.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [DELETE] }
      responses:
        '204': { description: Deleted; the session cookie is cleared }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/me/entitlement:
    get:
      tags: [billing]
      operationId: getMyEntitlement
      summary: Your plan, its retention window and the features it unlocks
      security: [{ webSession: [] }, { modToken: [] }]
      responses:
        '200':
          description: Entitlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/billing/checkout:
    post:
      tags: [billing]
      operationId: startCheckout
      summary: Start a Stripe Checkout for Pro or Max
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [pro, max] }
                interval: { type: string, enum: [month, year], default: month }
                creator:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{2,24}$'
                  description: Creator code (a paid partnership; the site labels it as an ad). Discount codes are typed on Stripe's page.
      responses:
        '200':
          description: Redirect the browser here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/billing/portal:
    post:
      tags: [billing]
      operationId: openBillingPortal
      summary: Stripe customer portal (cancel, change plan, invoices)
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Redirect the browser here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/auth/discord/start:
    get:
      tags: [discord]
      operationId: discordStart
      summary: Browser navigation. Redirects to Discord (scope identify only)
      description: mode=link needs a web session. Sets a short-lived HttpOnly ss_oauth cookie that the callback checks.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [login, link], default: login }
      responses:
        '302': { description: Redirect to Discord }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/auth/discord/callback:
    get:
      tags: [discord]
      operationId: discordCallback
      summary: Discord redirects here. Redirects to /me, /paired, /settings or /link with a ?discord= result
      description: |
        Connecting Discord from Settings lands on /paired?via=discord, or /settings?discord=cancelled|alt_needs_plan|unavailable.
        Signing in lands on /me (sets ss_session), or /link?discord=signed_up when this Discord user has no SkyStats account
        yet: that starts a sign-up (sets ss_pending) and the player pairs Minecraft next. Other /link results: invalid,
        expired, cancelled, unavailable.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: Redirect back to the site }

  /v1/auth/pending:
    get:
      tags: [discord]
      operationId: getPendingSignup
      summary: The Discord sign-up in progress (signed up with Discord, Minecraft not paired yet)
      description: Uses the ss_pending cookie. Pairing a Minecraft account from this browser finishes the sign-up.
      responses:
        '200':
          description: Sign-up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingSignup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [discord]
      operationId: cancelPendingSignup
      summary: Sign out of the sign-up and delete it (it holds only the Discord id and name)
      responses:
        '204': { description: Deleted }

  /v1/me/discord:
    get:
      tags: [discord]
      operationId: getMyDiscord
      summary: Whether Discord is linked to this account
      security: [{ webSession: [] }, { botKey: [] }]
      responses:
        '200':
          description: Discord link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscordLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [discord]
      operationId: unlinkMyDiscord
      summary: Unlink Discord from this account
      security: [{ webSession: [] }]
      responses:
        '204': { description: Unlinked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/accounts:
    get:
      tags: [discord]
      operationId: getMyAccounts
      summary: Minecraft accounts linked to the same Discord user
      security: [{ webSession: [] }, { botKey: [] }]
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/LinkedAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/switch:
    post:
      tags: [discord]
      operationId: switchAccount
      summary: Switch this browser to another of your Minecraft accounts (same Discord user)
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid: { type: string }
      responses:
        '200':
          description: Switched; a new ss_session cookie is set
          content:
            application/json:
              schema:
                type: object
                required: [switched]
                properties:
                  switched: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/sessions:
    get:
      tags: [me]
      operationId: getMySessions
      summary: Signed-in browsers and mods
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Sign out one browser or mod
      security: [{ webSession: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/sessions/revoke-others:
    post:
      tags: [me]
      operationId: revokeOtherSessions
      summary: Sign out everywhere except this browser
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
